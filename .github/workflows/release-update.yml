name: Update dependent Hugo sites
on:
  release:
    types: [published]

jobs:
  update-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get release tag and module path
        id: vars
        run: |
          echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          # From v2 on the module path ends with the major version (/v2):
          # read it from the go.mod of the released commit
          echo "path=$(awk '/^module /{print $2; exit}' go.mod)" >> $GITHUB_OUTPUT

      # Install Hugo
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Install Go
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Cache Hugo modules
      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # Update dependent sites
      - name: Update dependent sites
        run: |
          # Liste des dépôts à mettre à jour
          repos=(
            "sebousan/architectify-www"
            "sebousan/capitalify-www"
            "sebousan/handify-www"
            "sebousan/lawyerify-www"
            "sebousan/medicalify-www"
            "sebousan/realestatify-www"
          )

          for repo in "${repos[@]}"; do
            echo "Updating $repo..."
            git clone https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/$repo.git
            cd $(basename $repo)

            # Only the sites that require this module path: a 2.x release must
            # not reach a site still on v1, nor a 1.x release a site on v2
            if ! grep -qF "${{ steps.vars.outputs.path }} " go.mod; then
              echo "Skipping $repo: its go.mod does not require ${{ steps.vars.outputs.path }}"
              cd ..
              continue
            fi

            # Mettre à jour le module Hugo
            hugo mod get ${{ steps.vars.outputs.path }}@${{ steps.vars.outputs.tag }}
            hugo mod tidy

            git add go.mod go.sum
            git commit -m "chore: update hugolify-content-uncinqify to ${{ steps.vars.outputs.tag }}" || echo "No changes to commit"
            git push origin main
            cd ..
          done
    env:
      GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
